source = ~/.config/hypr/colors-wallust.conf

monitor = eDP-1, 1920x1200@144, 0x0, 1.2

env = LIBVA_DRIVER_NAME, nvidia
env = XDG_SESSION_TYPE, wayland
env = XDG_SESSION_DESKTOP, Hyprland
env = XDG_CURRENT_DESKTOP, Hyprland
env = GBM_BACKEND, nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME, nvidia
env = NVD_BACKEND, direct
env = ELECTRON_OZONE_PLATFORM_HINT, auto
env = MOZ_ENABLE_WAYLAND, 1
env = QT_QPA_PLATFORMTHEME, hyprqt6engine
env = QT_QUICK_CONTROLS_STYLE, org.hyprland.style
env = QT_STYLE_OVERRIDE, kvantum
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = XCURSOR_SIZE, 23
env = HYPRCURSOR_SIZE, 23

exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = hypridle
exec-once = swaync
exec-once = waybar
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waypaper --restore
exec-once = bash ~/.config/hypr/scripts/tools/start_dyn

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = $color4 $color6 90deg
    col.inactive_border = $background
    resize_on_border = true
    allow_tearing = true
    layout = scrolling
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1a1a2ecc)
        color_inactive = rgba(1a1a2e66)
    }
    blur {
        enabled = true
        size = 8
        passes = 2
        vibrancy = 0.18
        new_optimizations = true
        xray = false
        noise = 0.03
        contrast = 1.0
        brightness = 1.0
        popups = true
        popups_ignorealpha = 0.15
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.22, 1, 0.36, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = easeOutBack, 0.34, 1.56, 0.64, 1
    bezier = linear, 0, 0, 1, 1
    bezier = macos_overshot, 0.05, 0.9, 0.1, 1.05
    bezier = macos_smooth, 0.33, 1, 0.68, 1
    bezier = macos_accel, 0.5, 0, 1, 1
    bezier = water_drop, 0.25, 1.15, 0.35, 1.0
    bezier = ios_fluid, 0.32, 0.72, 0, 1
    bezier = pill_morph, 0.16, 1, 0.3, 1

    animation = global, 1, 1, easeOutQuint
    animation = windows, 1, 4.0, macos_overshot, popin 70%
    animation = windowsIn, 1, 4.0, macos_overshot, popin 70%
    animation = windowsOut, 1, 3.5, macos_accel, popin 80%
    animation = windowsMove, 1, 4.0, macos_overshot, slide
    animation = layers, 1, 3.5, pill_morph, slide top
    animation = layersIn, 1, 3.5, pill_morph, slide top
    animation = layersOut, 1, 2.5, pill_morph, slide top
    animation = fade, 1, 3.0, macos_smooth
    animation = fadeIn, 1, 3.0, macos_smooth
    animation = fadeOut, 1, 3.0, macos_smooth
    animation = fadeSwitch, 1, 3.0, macos_smooth
    animation = fadeShadow, 1, 3.0, macos_smooth
    animation = fadeDim, 1, 3.0, macos_smooth
    animation = workspaces, 1, 4.5, water_drop, slide
    animation = workspacesIn, 1, 4.5, water_drop, slide
    animation = workspacesOut, 1, 4.0, macos_accel, slide
    animation = border, 1, 5.0, macos_smooth
    animation = borderangle, 1, 20, linear, loop
}

input {
    kb_layout = us,ru
    kb_options = grp:alt_shift_toggle,caps:none
    follow_mouse = 1
    mouse_refocus = false
    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = true
        scroll_factor = 0.3
        tap_to_click = true
        drag_lock = true
        disable_while_typing = false
    }
}

device {
    name = asuf1204:00-2808:0202-touchpad
    enabled = false
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    initial_workspace_tracking = 1
    allow_session_lock_restore = true
    vrr = 2
}

binds {
    movefocus_cycles_fullscreen = true
    workspace_back_and_forth = false
    allow_workspace_cycles = true
    pass_mouse_when_bound = false
}

layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, swaync
layerrule = ignorezero, swaync
layerrule = blur, swaync-control-center
layerrule = ignorezero, swaync-control-center
layerrule = animation slide top, swaync-control-center
layerrule = blur, wlogout
layerrule = ignorezero, wlogout
layerrule = animation fade, hyprlock
layerrule = blur, zen-browser
layerrule = ignorezero, zen-browser
layerrule = animation fade, zen-browser

$mainMod = SUPER

bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, B, exec, firefox-developer-edition
bind = $mainMod, E, exec, nautilus --new-window
bind = $mainMod, W, exec, ~/.config/hypr/scripts/cycle_wall.sh
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill
bind = $mainMod CTRL, R, exec, hyprctl reload
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, fullscreen, 1
bind = $mainMod, T, togglefloating,
bind = $mainMod, P, pin,
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, SUPER_L, exec, rofi -show drun -theme ~/.config/rofi/rounded-pink-dark
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, Print, exec, grim -g "$(slurp)" - | satty --filename -
bind = , XF86PowerOff, exec, wlogout -b 3 -T 300 -B 300
bind = , XF86ScreenSaver, exec, hyprlock
binde = , XF86MonBrightnessUp, exec, brightnessctl -q s +10%
binde = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%-
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
